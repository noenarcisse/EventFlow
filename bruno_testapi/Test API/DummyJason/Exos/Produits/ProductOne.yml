info:
  name: ProductOne
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/products/1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let p = res.getBody()

        if(p.discountPercentage <= 0 || p.discountPercentage >= 50) {
          console.warn("Discount is abnormal")
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
