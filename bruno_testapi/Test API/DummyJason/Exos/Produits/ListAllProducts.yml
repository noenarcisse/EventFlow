info:
  name: ListAllProducts
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/products"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let errs = []

        res.getBody().products.forEach(p => {
          if (p.stock < 0) {
            console.warn(e.title+ " has a stock error")
            errs.push(p)
          } 
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
