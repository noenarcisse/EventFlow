info:
  name: SearchPhoneInProducts
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/products/search?q=phone"
  params:
    - name: q
      value: phone
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.body.total
      operator: gt
      value: "0"
    - expression: res.body.products[0].price
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
