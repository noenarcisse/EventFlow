info:
  name: UserOne
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users/1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let d = res.getBody()
        if(typeof d.id !== 'number' || !d.email.includes("@")) {
          throw new Error("Validation échouée")
        }

        if(typeof d.id === 'number' &&  d.email.includes("@")) console.log("Bien joué")

        test("id est un nombre", () => {
          const isnum = typeof d.id === "number"
          expect(isnum).to.be.true
        })

        // if (reg.test(d.phone)) console.log("Le numéro de tel est niquel chrome")
        test("numéro de tel valid", () => {
          const reg = /^\+?[\d\s-]{3,20}$/
          const isvalid = reg.test(d.phone)
          expect(isvalid).to.be.true
        })
  assertions:
    - expression: res.body.firstName
      operator: eq
      value: Terry
    - expression: res.body.role
      operator: contains
      value: admin
    - expression: res.body.role
      operator: contains
      value: user

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
