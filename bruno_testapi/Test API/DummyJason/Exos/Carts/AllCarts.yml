info:
  name: AllCarts
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/carts"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const q = 500
        let hasBigCart = res.getBody().carts.some(c => c.total > q)
        if (!hasBigCart) console.log("Aucun panier > "+q)

        let firstBig = res.getBody().carts.find(c => c.total > 500)
        console.log(firstBig)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
