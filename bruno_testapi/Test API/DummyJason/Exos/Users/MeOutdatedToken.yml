info:
  name: MeOutdatedToken
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status === 401) console.log("CODE 401")

        test("CODE 401 Fuyez pauvres fous", () => {
          expect(res.getStatus()).to.eq(401)
        })
        test("Err msg is Token Expired", () => {
          expect(res.getBody().message.toLowerCase()).to.includes("expired")
        //   expect(res.getBody().message.toLowerCase()).to.include("expiredd")
        //   expect(res.getBody().message.toLowerCase()).to.contains("expired")
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
