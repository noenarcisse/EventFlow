info:
  name: Connect as Emily
  type: http
  seq: 1

http:
  method: POST
  url: https://dummyjson.com/auth/login
  body:
    type: json
    data: |-
      {
         "username": "emilys",
          "password": "emilyspass"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody().accessToken
        bru.setVar("token", token)

        console.log(bru.getVar("token"))

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
