line-length = 120
target-version="py312"

[lint]
extend-select = ["S", "T20", "PT", "N", "TID251"]
ignore = ["S107", "T201", "PT006"]

[lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Pas de sleep dans les tests : utilise une attente conditionnelle (polling avec timeout)."

[lint.per-file-ignores]
"tests/**" = ["S101","S105"]
"utils/**" = ["S101"]
"conftest.py" = ["S101"]

[format]